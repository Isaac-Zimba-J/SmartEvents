<div class="form-page">
  <div class="form-header">
    <a routerLink="/venues">&larr; Back to Venues</a>
    <h1>Edit Venue</h1>
  </div>

  @if (loading) {
    <p>Loading venue...</p>
  } @else if (error && !venue) {
    <p class="error">{{ error }}</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="form-card">

      <div class="form-section">
        <h2>Venue Details</h2>

        <div class="field">
          <label>Name *</label>
          <input type="text" formControlName="name" placeholder="Venue name" />
        </div>

        <div class="field">
          <label>Description</label>
          <textarea formControlName="description" rows="3" placeholder="Describe the venue..."></textarea>
        </div>

        <div class="field">
          <label>Image URL</label>
          <input type="url" formControlName="imageUrl" placeholder="https://..." />
        </div>

        <div class="field-row">
          <div class="field">
            <label>Type *</label>
            <select formControlName="type">
              @for (t of types; track t) {
                <option [value]="t">{{ t }}</option>
              }
            </select>
          </div>
          <div class="field">
            <label>Capacity *</label>
            <input type="number" formControlName="capacity" min="1" />
          </div>
        </div>

        <div class="field">
          <label>Amenities</label>
          <input type="text" formControlName="amenities" placeholder="WiFi, Parking, AV Equipment..." />
        </div>

        <div class="field">
          <label>Price Per Day (USD)</label>
          <input type="number" formControlName="pricePerDay" min="0" step="0.01" />
        </div>

        <div class="field checkbox-field">
          <label>
            <input type="checkbox" formControlName="isAvailable" />
            Available for booking
          </label>
        </div>
      </div>

      <div class="form-section">
        <h2>Location</h2>

        <div class="field">
          <label>Address *</label>
          <input type="text" formControlName="address" placeholder="Street address" />
        </div>

        <div class="field-row">
          <div class="field">
            <label>City *</label>
            <input type="text" formControlName="city" placeholder="City" />
          </div>
          <div class="field">
            <label>Country *</label>
            <input type="text" formControlName="country" placeholder="Country" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Latitude</label>
            <input type="number" formControlName="latitude" step="any" />
          </div>
          <div class="field">
            <label>Longitude</label>
            <input type="number" formControlName="longitude" step="any" />
          </div>
        </div>
      </div>

      @if (error) {
        <p class="error">{{ error }}</p>
      }

      <div class="form-actions">
        <a routerLink="/venues" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary" [disabled]="saving || form.invalid">
          {{ saving ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>
    </form>
  }
</div>
