<div class="form-page">
  <div class="form-header">
    <a routerLink="/companies">&larr; Back to Companies</a>
    <h1>Edit Company</h1>
  </div>

  @if (loading) {
    <p>Loading company...</p>
  } @else if (error && !company) {
    <p class="error">{{ error }}</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="form-card">

      <div class="form-section">
        <h2>Company Info</h2>

        <div class="field">
          <label>Name *</label>
          <input type="text" formControlName="name" placeholder="Company name" />
        </div>

        <div class="field">
          <label>Description</label>
          <textarea formControlName="description" rows="3" placeholder="What does this company do?"></textarea>
        </div>

        <div class="field">
          <label>Logo URL</label>
          <input type="url" formControlName="logoUrl" placeholder="https://..." />
        </div>
      </div>

      <div class="form-section">
        <h2>Contact</h2>

        <div class="field">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="info@company.com" />
        </div>

        <div class="field">
          <label>Phone</label>
          <input type="tel" formControlName="phone" placeholder="+265 999 000 000" />
        </div>

        <div class="field">
          <label>Website</label>
          <input type="url" formControlName="website" placeholder="https://company.com" />
        </div>

        <div class="field">
          <label>Address</label>
          <input type="text" formControlName="address" placeholder="Physical address" />
        </div>
      </div>

      @if (error) {
        <p class="error">{{ error }}</p>
      }

      <div class="form-actions">
        <a routerLink="/companies" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary" [disabled]="saving || form.invalid">
          {{ saving ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>
    </form>
  }
</div>
