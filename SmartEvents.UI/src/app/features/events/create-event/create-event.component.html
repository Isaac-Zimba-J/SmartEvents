<div class="form-page">
  <div class="form-header">
    <a routerLink="/events">&larr; Back to Events</a>
    <h1>Create Event</h1>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form-card">

    <div class="form-section">
      <h2>Basic Info</h2>

      <div class="field">
        <label>Title *</label>
        <input type="text" formControlName="title" placeholder="Event title" />
      </div>

      <div class="field">
        <label>Description</label>
        <textarea formControlName="description" rows="4" placeholder="Describe your event..."></textarea>
      </div>

      <div class="field">
        <label>Image URL</label>
        <input type="url" formControlName="imageUrl" placeholder="https://..." />
      </div>

      <div class="field">
        <label>Category *</label>
        <select formControlName="category">
          @for (cat of categories; track cat) {
            <option [value]="cat">{{ cat }}</option>
          }
        </select>
      </div>

      <div class="field">
        <label>Tags</label>
        <input type="text" formControlName="tags" placeholder="tech, music, outdoor (comma separated)" />
      </div>
    </div>

    <div class="form-section">
      <h2>Date &amp; Venue</h2>

      <div class="field-row">
        <div class="field">
          <label>Start Date &amp; Time *</label>
          <input type="datetime-local" formControlName="startDate" />
        </div>
        <div class="field">
          <label>End Date &amp; Time *</label>
          <input type="datetime-local" formControlName="endDate" />
        </div>
      </div>

      <div class="field">
        <label>Timezone</label>
        <input type="text" formControlName="timezone" placeholder="UTC" />
      </div>

      <div class="field">
        <label>Venue</label>
        <select formControlName="venueId">
          <option value="">— No venue selected —</option>
          @for (venue of venues; track venue.id) {
            <option [value]="venue.id">{{ venue.name }} — {{ venue.city }}, {{ venue.country }}</option>
          }
        </select>
      </div>
    </div>

    <div class="form-section">
      <h2>Capacity &amp; Tickets</h2>

      <div class="field">
        <label>Max Attendees *</label>
        <input type="number" formControlName="maxAttendees" min="1" />
      </div>

      <div class="field-row">
        <div class="field checkbox-field">
          <label>
            <input type="checkbox" formControlName="isTicketed" />
            Paid event (requires ticket purchase)
          </label>
        </div>
        <div class="field checkbox-field">
          <label>
            <input type="checkbox" formControlName="waitlistEnabled" />
            Enable waitlist when full
          </label>
        </div>
        <div class="field checkbox-field">
          <label>
            <input type="checkbox" formControlName="isPublic" />
            Public event (visible to everyone)
          </label>
        </div>
      </div>

      @if (isTicketed) {
        <div class="field">
          <label>Ticket Price (USD) *</label>
          <input type="number" formControlName="ticketPrice" min="0" step="0.01" />
        </div>
      }
    </div>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <div class="form-actions">
      <a routerLink="/events" class="btn-secondary">Cancel</a>
      <button type="submit" class="btn-primary" [disabled]="loading || form.invalid">
        {{ loading ? 'Creating...' : 'Create Event' }}
      </button>
    </div>
  </form>
</div>
