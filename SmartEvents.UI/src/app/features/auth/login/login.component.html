<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <lucide-icon name="Calendar" [size]="28" class="auth-logo-icon" />
      <span>SmartEvents</span>
    </div>
    <h2>Welcome back</h2>
    <p class="auth-sub">Sign in to your account</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <!-- <lucide-icon name="Mail" [size]="16" class="input-icon" /> -->
          <input id="email" type="email" formControlName="email" placeholder="you@example.com" class="has-icon" />
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <!-- <lucide-icon name="Shield" [size]="16" class="input-icon" /> -->
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            class="has-icon has-icon-right"
          />
          <button type="button" class="eye-btn" (click)="showPassword = !showPassword" tabindex="-1">
            <lucide-icon [img]="showPassword ? EyeOff : Eye" [size]="16" />
          </button>
        </div>
      </div>

      @if (error) {
        <div class="alert alert-error">
          <lucide-icon name="AlertCircle" [size]="15" />
          {{ error }}
        </div>
      }

      <button type="submit" class="btn-primary btn-block" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="auth-footer">Don't have an account? <a routerLink="/auth/register">Create one</a></p>
  </div>
</div>
